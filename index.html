<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30. Geburtstag Party-Einladung!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      border: 4px solid #ff4081;
      text-align: center;
      animation: pop 0.5s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      color: #ff4081;
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-shadow: 2px 2px #ffe082;
    }
    .tagline {
      font-size: 1.2rem;
      font-weight: bold;
      color: #7c4dff;
      margin-bottom: 25px;
    }
    .details {
      background: #fff8e1;
      border: 2px dashed #ffb300;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
    }
    .details-item {
      margin-bottom: 12px;
      font-size: 1.05rem;
      display: flex;
      align-items: flex-start;
    }
    .details-item:last-child {
      margin-bottom: 0;
    }
    .icon {
      font-size: 1.3rem;
      margin-right: 10px;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .photo-frame {
      width: 120px;
      height: 120px;
      background: #fff;
      padding: 5px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }
    .rsvp-btn {
      display: inline-block;
      background: linear-gradient(45deg, #ff4081, #ff80ab);
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .rsvp-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Die 30 ruft! 🥳</h1>
    <p class="tagline">Ich werde 30 und das muss gefeiert werden!</p>
    
    <div class="gallery">
      <div class="photo-frame">
        <img src="20250813_134114.jpg" alt="Foto 1">
      </div>
      <div class="photo-frame">
        <img src="IMG-20250109-WA0004.jpg" alt="Foto 2">
      </div>
    </div>

    <div class="details">
      <div class="details-item">
        <span class="icon">📅</span>
        <div><strong>Wann:</strong> Samstag, 05.12.2026 ab 18:00 Uhr</div>
      </div>
      <div class="details-item">
        <span class="icon">📍</span>
        <div><strong>Wo:</strong> Währenzeiner Hauptstraße 94</div>
      </div>
      <div class="details-item">
        <span class="icon">🍕</span>
        <div><strong>Verpflegung:</strong> Für Essen & kühle Getränke ist gesorgt!</div>
      </div>
      <div class="details-item">
        <span class="icon">🎈</span>
        <div><strong>Mitbringen:</strong> Gute Laune!</div>
      </div>
    </div>

    <a href="mailto:deine-email@beispiel.de?subject=Zusage%20Geburtstagsparty" class="rsvp-btn">Jetzt zusagen! ✨</a>
  </div>
</body>
</html>
